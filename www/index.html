<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050a10">
  <title>Nargil Strike Sim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hud-box"><span>MISSION</span><b id="score">0</b></div>
    <div class="hud-box"><span>LIVES</span><b id="lives">3</b></div>
    <div class="hud-box env-box" id="status">READY</div>
  </div>

  <div id="crosshair">
    <div class="ch-h"></div>
    <div class="ch-v"></div>
  </div>

  <div id="targetMarker" class="hidden">⌖</div>
  <div id="lockText" class="hidden">TARGET LOCKED</div>

  <div id="fireBtn">🚀</div>

  <div id="menu" class="overlay">
    <div class="menu-box">
      <h1>NARGIL STRIKE</h1>
      <p>Tactical Missile Strike Simulator</p>
      <div class="hint">
        👆 Tap the city to designate a target<br>
        🎯 Press 🚀 to launch the Nargil missile<br>
        ⚙️ Real-time 3-DOF physics & PN guidance
      </div>
      <button id="startBtn">BEGIN MISSION</button>
      <div class="record">🏆 Best: <span id="bestScore">0</span></div>
    </div>
  </div>

  <div id="gameOver" class="overlay hidden">
    <div class="menu-box">
      <h1 style="color:#ff5566">MISSION ENDED</h1>
      <p>Score: <b id="finalScore">0</b></p>
      <p>Best: <b id="finalBest">0</b></p>
      <button id="restartBtn">REDEPLOY</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
