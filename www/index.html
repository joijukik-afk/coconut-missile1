<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0520">
  <title>پرتاب موشک نارگیل</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hud-item"><span>امتیاز</span><b id="score">0</b></div>
    <div class="hud-item"><span>جان</span><b id="lives">3</b></div>
  </div>

  <div id="levelUp">مرحله ۲</div>

  <div id="menu" class="overlay">
    <div class="menu-box">
      <h1>🥥 موشک نارگیل 🚀</h1>
      <p>نارگیل‌ها را قبل از رسیدن به زمین نابود کن!</p>
      <span class="hint">📱 روی هر جای صفحه بزن تا شلیک شود</span>
      <button id="startBtn">شروع بازی</button>
      <div class="record">🏆 رکورد: <span id="bestScore">0</span></div>
    </div>
  </div>

  <div id="gameOver" class="overlay hidden">
    <div class="menu-box">
      <h1 style="color:#ff5566">💥 بازی تمام شد</h1>
      <p>امتیاز تو: <b id="finalScore">0</b></p>
      <p>بهترین: <b id="finalBest">0</b></p>
      <button id="restartBtn">دوباره بازی کن</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
